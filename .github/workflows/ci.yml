# mjbase CI（Linux + Windows）
#
# 范围：mjbase 静态库 + mjbase_unittest 全量单测（target 是 set_default(false)，
# 必须显式构建）。
# 依赖：luiox-repo git 直连包（libca/libjbc 家族等）——root xmake.lua 内
# add_repositories 已指向 GitHub 远端，CI 无需显式注册；gtest/libarchive/zlib
# 走 xrepo（libarchive 用仓内覆盖包 xmake/repo，规避官方包 Linux 编译失败）。
# 注意 set_defaultplat("windows")：Linux 配置必须显式 -p linux。

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: docs (引用门禁 + Sphinx)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Sphinx
        # 钉死本地实测通过的版本：-W 下警告集合随 Sphinx 小版本变，范围安装等于定时炸；升级随文档批次显式改这一行。
        run: python -m pip install --upgrade "sphinx==9.1.1"

      - name: Reference gate (check_refs)
        run: python mjbase/doc/check_refs.py .

      # -E：增量缓存会跳过「回到旧状态」的文件，警告随之消失，等于没门禁。
      - name: "Build design docs (-W: 警告即失败)"
        run: sphinx-build -b html -E -W --keep-going mjbase/doc mjbase/doc/_build

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: mjbase-doc-html
          path: mjbase/doc/_build
          retention-days: 14

      # 微观层：Doxygen 只吃头文件 /// 注释，与 RST 站互不干涉。
      # 版本必须钉死（与本地实测同版）：Doxyfile 的 WARN_* 档随版本增减标签，
      # apt 里的老版本会把「不认识的标签」报成告警，WARN_AS_ERROR 下直接变红。
      - name: Install Doxygen (pinned 1.18.0)
        run: |
          curl -fsSL https://www.doxygen.nl/files/doxygen-1.18.0.linux.bin.tar.gz -o /tmp/dox.tar.gz
          mkdir -p "$HOME/doxygen"
          tar xzf /tmp/dox.tar.gz -C "$HOME/doxygen" --strip-components=1
          echo "$HOME/doxygen/bin" >> "$GITHUB_PATH"
          doxygen --version

      - name: Build API docs (WARN_AS_ERROR)
        run: doxygen mjbase/Doxyfile

      - name: Upload API site
        uses: actions/upload-artifact@v4
        with:
          name: mjbase-doc-apidoc
          path: mjbase/doc/_apidoc/html
          retention-days: 14

  build-and-test-linux:
    name: build & test (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK (jdk_finder scanning tests)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: v3.0.9
          actions-cache-folder: '.xmake-cache'

      - name: Cache xrepo packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.xmake/packages
            ~/.local/share/xmake
          key: mjbase-xrepo-linux-x64-xmake309-${{ hashFiles('xmake.lua', 'xmake/packages/*.lua') }}
          restore-keys: |
            mjbase-xrepo-linux-x64-xmake309-

      - name: Configure (with tests)
        run: xmake f -p linux --with_tests=y -y

      - name: Build library
        run: xmake -y
      - name: Build tests
        run: xmake -y mjbase_unittest

      - name: Run unit tests
        run: xmake run mjbase_unittest

  build-and-test-windows:
    name: build & test (windows)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK (jdk_finder scanning tests)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: v3.0.9
          actions-cache-folder: '.xmake-cache'

      - name: Cache xrepo packages
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/.xmake/packages
          key: mjbase-xrepo-windows-x64-xmake309-${{ hashFiles('xmake.lua', 'xmake/packages/*.lua') }}
          restore-keys: |
            mjbase-xrepo-windows-x64-xmake309-

      - name: Configure (with tests)
        shell: bash
        run: xmake f -p windows --with_tests=y -y

      - name: Build library
        shell: bash
        run: xmake -y
      - name: Build tests
        shell: bash
        run: xmake -y mjbase_unittest

      - name: Run unit tests
        shell: bash
        run: xmake run mjbase_unittest
