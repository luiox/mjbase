# mjbase main 前进时通知 mjt 仓的 mjbase pin check 工作流立即抬 ref。
#
# 前置：本仓 Settings → Secrets and variables → Actions 配置
# MJT_DISPATCH_TOKEN（具备 luiox/mjt 的 contents:write 与 pull-requests:write
# 权限的 PAT）。只经 Actions API 调用，不出现在日志。未配置时本工作流空跑，
# mjt 侧的每日定时兜底照常工作。

name: notify mjt

on:
  push:
    branches: [main]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send repository_dispatch to mjt
        env:
          GH_TOKEN: ${{ secrets.MJT_DISPATCH_TOKEN }}
        if: env.GH_TOKEN != ''
        run: |
          gh api repos/luiox/mjt/dispatches \
            -f event_type=mjbase-main-updated \
            -F 'client_payload[sha]=${{ github.sha }}'
